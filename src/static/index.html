<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contract &amp; Lease Review Assistant</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --border: #e0e2e7;
    --text: #1b1e24;
    --muted: #6b7280;
    --accent: #2f6feb;
    --accent-fg: #ffffff;
    --user-bubble: #2f6feb;
    --assistant-bubble: #eef1f6;
    --danger: #c0392b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 17px; margin: 0; }
  header .disclaimer { font-size: 12px; color: var(--muted); }

  .layout {
    flex: 1;
    display: flex;
    min-height: 0;
  }

  .sidebar {
    width: 280px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    overflow-y: auto;
  }
  .sidebar h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 6px; }
  .sidebar .field { display: flex; flex-direction: column; gap: 8px; }
  input[type="file"] { font-size: 13px; }
  button {
    font: inherit;
    font-size: 13px;
    padding: 8px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--panel);
    cursor: pointer;
  }
  button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button:hover:not(:disabled) { filter: brightness(0.96); }

  .loaded-doc {
    font-size: 13px;
    padding: 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    word-break: break-word;
  }
  .loaded-doc .none { color: var(--muted); }

  .session-id { font-size: 11px; color: var(--muted); word-break: break-all; }

  .chat {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg { max-width: 720px; display: flex; flex-direction: column; gap: 4px; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.assistant { align-self: flex-start; align-items: flex-start; }
  .bubble {
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .msg.user .bubble { background: var(--user-bubble); color: var(--accent-fg); border-bottom-right-radius: 2px; }
  .msg.assistant .bubble { background: var(--assistant-bubble); color: var(--text); border-bottom-left-radius: 2px; }
  .msg.assistant .bubble h1, .msg.assistant .bubble h2, .msg.assistant .bubble h3 {
    font-size: 14px; margin: 0.6em 0 0.3em;
  }
  .msg.assistant .bubble ul { margin: 0.3em 0; padding-left: 1.2em; }
  .msg.assistant .bubble strong { font-weight: 700; }
  .msg .role { font-size: 11px; color: var(--muted); }
  .msg.error .bubble { background: #fbeae8; color: var(--danger); }

  .composer {
    border-top: 1px solid var(--border);
    background: var(--panel);
    padding: 12px 20px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .composer textarea {
    flex: 1;
    resize: none;
    min-height: 42px;
    max-height: 140px;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    font: inherit;
    font-size: 14px;
  }
  .quick-actions { display: flex; gap: 6px; padding: 0 20px 10px; flex-wrap: wrap; }
  .quick-actions button { font-size: 12px; }

  .typing { font-size: 13px; color: var(--muted); padding: 0 20px 8px; }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181d;
      --panel: #1e2127;
      --border: #2c303a;
      --text: #e8e9ec;
      --muted: #9096a2;
      --assistant-bubble: #2a2e37;
    }
  }
</style>
</head>
<body>

<header>
  <h1>Contract &amp; Lease Review Assistant</h1>
  <span class="disclaimer">Not legal advice — a reading aid only.</span>
</header>

<div class="layout">
  <aside class="sidebar">
    <div>
      <h2>Load a document</h2>
      <div class="field">
        <input type="file" id="fileInput" accept=".pdf,.txt" />
        <button id="uploadBtn" class="primary">Upload &amp; load</button>
        <button id="sampleBtn">Try the sample lease</button>
      </div>
    </div>

    <div>
      <h2>Currently loaded</h2>
      <div class="loaded-doc" id="loadedDoc"><span class="none">No document loaded yet</span></div>
    </div>

    <div>
      <h2>Session</h2>
      <div class="session-id" id="sessionIdLabel">(none yet — starts on first message)</div>
      <button id="resetBtn" style="margin-top:8px;">Start new session</button>
    </div>
  </aside>

  <main class="chat">
    <div class="messages" id="messages"></div>
    <div class="typing" id="typing" style="display:none;">Thinking…</div>
    <div class="quick-actions">
      <button id="reviewBtn">Review this contract</button>
      <button id="whatCanYouDoBtn">What can you help with?</button>
    </div>
    <div class="composer">
      <textarea id="messageInput" placeholder="Ask a question, or say &quot;review this contract&quot;…"></textarea>
      <button id="sendBtn" class="primary">Send</button>
    </div>
  </main>
</div>

<script>
(function () {
  const messagesEl = document.getElementById('messages');
  const typingEl = document.getElementById('typing');
  const messageInput = document.getElementById('messageInput');
  const sendBtn = document.getElementById('sendBtn');
  const reviewBtn = document.getElementById('reviewBtn');
  const whatCanYouDoBtn = document.getElementById('whatCanYouDoBtn');
  const fileInput = document.getElementById('fileInput');
  const uploadBtn = document.getElementById('uploadBtn');
  const sampleBtn = document.getElementById('sampleBtn');
  const resetBtn = document.getElementById('resetBtn');
  const loadedDocEl = document.getElementById('loadedDoc');
  const sessionIdLabel = document.getElementById('sessionIdLabel');

  let sessionId = localStorage.getItem('cra_session_id') || null;
  let loadedFilename = localStorage.getItem('cra_loaded_filename') || null;

  renderSessionId();
  renderLoadedDoc();

  function renderSessionId() {
    sessionIdLabel.textContent = sessionId ? sessionId : '(none yet — starts on first message)';
  }

  function renderLoadedDoc() {
    loadedDocEl.innerHTML = loadedFilename
      ? escapeHtml(loadedFilename)
      : '<span class="none">No document loaded yet</span>';
  }

  function setSession(id) {
    sessionId = id;
    localStorage.setItem('cra_session_id', id);
    renderSessionId();
  }

  function setLoadedFilename(name) {
    loadedFilename = name;
    localStorage.setItem('cra_loaded_filename', name);
    renderLoadedDoc();
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // Minimal markdown -> HTML for assistant replies (headers, bold, bullets, paragraphs).
  function renderMarkdown(text) {
    const escaped = escapeHtml(text);
    const lines = escaped.split('\n');
    let html = '';
    let inList = false;
    for (const line of lines) {
      const heading = line.match(/^(#{1,3})\s+(.*)/);
      const bullet = line.match(/^[-*]\s+(.*)/);
      if (heading) {
        if (inList) { html += '</ul>'; inList = false; }
        const level = heading[1].length;
        html += `<h${level}>${inlineMd(heading[2])}</h${level}>`;
      } else if (bullet) {
        if (!inList) { html += '<ul>'; inList = true; }
        html += `<li>${inlineMd(bullet[1])}</li>`;
      } else if (line.trim() === '') {
        if (inList) { html += '</ul>'; inList = false; }
      } else {
        if (inList) { html += '</ul>'; inList = false; }
        html += `<div>${inlineMd(line)}</div>`;
      }
    }
    if (inList) html += '</ul>';
    return html;
  }

  function inlineMd(str) {
    return str.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  }

  function addMessage(role, text, opts) {
    opts = opts || {};
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + role + (opts.error ? ' error' : '');
    const roleLabel = document.createElement('div');
    roleLabel.className = 'role';
    roleLabel.textContent = role === 'user' ? 'You' : (opts.error ? 'Error' : 'Assistant');
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    if (role === 'assistant' && !opts.error) {
      bubble.innerHTML = renderMarkdown(text);
    } else {
      bubble.textContent = text;
    }
    wrap.appendChild(roleLabel);
    wrap.appendChild(bubble);
    messagesEl.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function setBusy(busy) {
    typingEl.style.display = busy ? 'block' : 'none';
    sendBtn.disabled = busy;
    reviewBtn.disabled = busy;
    uploadBtn.disabled = busy;
    sampleBtn.disabled = busy;
  }

  async function sendMessage(text) {
    if (!text.trim()) return;
    addMessage('user', text);
    messageInput.value = '';
    setBusy(true);
    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, session_id: sessionId }),
      });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.detail || `Request failed (${res.status})`);
      }
      const data = await res.json();
      setSession(data.session_id);
      addMessage('assistant', data.message);
    } catch (err) {
      addMessage('assistant', 'Something went wrong: ' + err.message, { error: true });
    } finally {
      setBusy(false);
    }
  }

  async function uploadFile() {
    const file = fileInput.files[0];
    if (!file) {
      addMessage('assistant', 'Choose a .pdf or .txt file first.', { error: true });
      return;
    }
    const form = new FormData();
    form.append('file', file);
    if (sessionId) form.append('session_id', sessionId);

    setBusy(true);
    try {
      const res = await fetch('/upload', { method: 'POST', body: form });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.detail || `Upload failed (${res.status})`);
      }
      const data = await res.json();
      setSession(data.session_id);
      setLoadedFilename(data.filename);
      addMessage('assistant', data.message);
    } catch (err) {
      addMessage('assistant', 'Upload failed: ' + err.message, { error: true });
    } finally {
      setBusy(false);
    }
  }

  async function loadSample() {
    setBusy(true);
    try {
      const res = await fetch('/load-sample', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: sessionId }),
      });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.detail || `Request failed (${res.status})`);
      }
      const data = await res.json();
      setSession(data.session_id);
      setLoadedFilename(data.filename);
      addMessage('assistant', data.message);
    } catch (err) {
      addMessage('assistant', 'Could not load sample: ' + err.message, { error: true });
    } finally {
      setBusy(false);
    }
  }

  sendBtn.addEventListener('click', () => sendMessage(messageInput.value));
  messageInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage(messageInput.value);
    }
  });
  reviewBtn.addEventListener('click', () => sendMessage('Please review this contract for risky clauses.'));
  whatCanYouDoBtn.addEventListener('click', () => sendMessage('What can you help me with?'));
  uploadBtn.addEventListener('click', uploadFile);
  sampleBtn.addEventListener('click', loadSample);
  resetBtn.addEventListener('click', () => {
    localStorage.removeItem('cra_session_id');
    localStorage.removeItem('cra_loaded_filename');
    sessionId = null;
    loadedFilename = null;
    renderSessionId();
    renderLoadedDoc();
    messagesEl.innerHTML = '';
    addMessage('assistant', 'Started a new session. Load a contract or ask a question.');
  });

  addMessage('assistant', 'Hi! Upload a contract or lease (or try the sample), then ask me to review it or answer questions about it.');
})();
</script>

</body>
</html>
